[package]
name = "diag"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Process diagnostics: Channel/Level sinks, JSONL traces, counting allocator."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }

[lints]
workspace = true
