// Default controls — bind-id names follow the retail bind table.
// Host defaults, not a dump of retail config_mp.cfg.
// Edit and re-run `binddefaults`, or paste lines into the console.

bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind SPACE +gostand
bind C +movedown
bind CTRL +movedown
bind SHIFT +breath_sprint
bind MWHEELDOWN +gostand

bind MOUSE1 +attack
bind MOUSE2 +speed_throw
bind MOUSE3 weapnext

bind R +reload
bind V +melee
bind E +activate
bind F +frag
bind G drop
bind TAB +scores

bind 1 slot1
bind 2 slot2
bind 3 slot3
bind 4 slot4
bind 5 slot5
